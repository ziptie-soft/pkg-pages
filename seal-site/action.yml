# seal-site: sign the metadata files that build-site listed, with the CI subkey, after checking the
# key fails closed against the committed pin. The only step of a site build that holds the key.
# Contract: docs/actions.md#seal-site.
name: pkg-pages seal-site
description: Sign a built site's metadata files with a CI signing subkey checked against a committed public key
author: ziptie-soft

inputs:
  site:
    description: The site directory build-site wrote. Only the signature files are added to it.
    required: true
  to-sign:
    description: The list build-site wrote (its to-sign output), one path relative to the site per line.
    required: true
  public-key:
    description: Path of the committed public key (the pin), in the caller's checkout.
    required: false
    default: packaging/signing/repo.asc
  signing-key:
    description: Armored secret signing subkey without a passphrase. Pass a secret; never log it.
    required: false
    default: ''
  runner-mode:
    description: docker (pinned Debian image of images.env) or host (gpg already installed).
    required: false
    default: docker

outputs:
  signed:
    description: "'true' when the files were signed; 'false' when no pin and no key (nothing signed)."
    value: ${{ steps.run.outputs.signed }}
  fingerprint:
    description: Primary key fingerprint of the pin, when signed.
    value: ${{ steps.run.outputs.fingerprint }}

runs:
  using: composite
  steps:
    - name: Sign the metadata
      id: run
      shell: bash
      env:
        INPUT_SITE: ${{ inputs.site }}
        INPUT_TO_SIGN: ${{ inputs.to-sign }}
        INPUT_PUBLIC_KEY: ${{ inputs.public-key }}
        INPUT_RUNNER_MODE: ${{ inputs.runner-mode }}
        REPO_SIGNING_KEY: ${{ inputs.signing-key }}
      run: '"$GITHUB_ACTION_PATH/../lib/action.sh" seal-site'
