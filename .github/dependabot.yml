version: 2
updates:
  # Bumps the SHA and the `# vX.Y.Z` comment of every pinned action, in the workflows and in each
  # action.yml (the root one and every <action>/action.yml). Container digests in images.env are
  # updated by hand (see the comment there).
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/sign-rpm'
      - '/check-rpm'
      - '/fetch-history'
      - '/install-test'
      - '/package-rust'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    # publish.yml's references to this repository's own actions are rewritten by dev/self-pin.sh
    # at each release (docs/releasing.md#the-self-pin), never by Dependabot.
    ignore:
      - dependency-name: 'ziptie-soft/pkg-pages*'
    groups:
      all-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
