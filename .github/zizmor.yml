# zizmor (`mise run lint:zizmor`, and online in CI).
rules:
  # `uses: $/path` needs runner 2.336+ and dev/check-action-pins.sh doesn't parse it. The only
  # `./` uses are in ci.yml, which tests this checkout's actions on purpose; shipped code may not
  # use either form (dev/check-self-refs.sh). Same as .github/jactionlint.yaml.
  self-repository:
    disable: true
