name: Release

# release-please keeps one release PR (conventional commits decide the bump). Merging it tags
# vX.Y.Z and creates the GitHub release. Callers pin that tag's commit SHA.
#
# The self-pin (docs/releasing.md#the-self-pin): publish.yml can't call its own commit's actions,
# so after release-please updates its PR, `self-pin` adds a commit to that PR pointing
# publish.yml's `ziptie-soft/pkg-pages/<action>@<sha>` references at the master commit the PR is
# based on (W). Merging the PR (rebase) puts the release and pin commits on top of W, and the tag
# X then calls actions@W, which are identical to X's own. `check-release` verifies that on the
# tagged commit.
on:
  push:
    branches: [master]

permissions: {}

# Releases queue instead of cancelling: a cancelled run can leave a tag without its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    if: ${{ github.repository_owner == 'ziptie-soft' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: release
    permissions: {}
    outputs:
      release-created: ${{ steps.rp.outputs.release_created }}
      sha: ${{ steps.rp.outputs.sha }}
      pr-branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - name: Release app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # the release commit, tag and GitHub release
          permission-issues: write # release-please labels
          permission-pull-requests: write # the release PR

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  self-pin:
    name: Pin publish.yml in the release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.pr-branch != '' && needs.release-please.outputs.release-created != 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read # checkout
    steps:
      - name: Release app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the pin commit to the release PR branch
          permission-workflows: write # the pin commit changes .github/workflows/publish.yml

      # Only the trusted commit that triggered this run (W, on master) is checked out: its
      # dev/self-pin.sh does the rewrite. The release PR branch is read and updated through the
      # API, so nothing from it is checked out or executed while the token exists.
      - name: Checkout W (the scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin publish.yml to the commit the release is based on
        shell: bash
        env:
          W: ${{ github.sha }}
          BRANCH: ${{ needs.release-please.outputs.pr-branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          file=.github/workflows/publish.yml
          # The branch must be W plus commits that leave the actions alone (release-please's
          # changelog and version bump), as dev/self-pin.sh --check requires of the release.
          status="$(gh api "${api}/compare/${W}...${BRANCH}" --jq .status)"
          case "${status}" in ahead | identical) ;; *)
            echo "::error::the release PR branch is ${status} of ${W}, not based on it"; exit 1 ;;
          esac
          shipped="$(gh api "${api}/compare/${W}...${BRANCH}" --jq '.files[].filename' |
            grep -E '^(action\.yml|images\.env|lib/.*|[^/]+/action\.yml)$' || true)"
          if [ -n "${shipped}" ]; then
            echo "::error::the release PR changes shipped files after ${W}: ${shipped}"; exit 1
          fi
          version="$(gh api "${api}/contents/.release-please-manifest.json?ref=${BRANCH}" \
            --jq .content | base64 -d | sed -n 's/^ *"\.": *"\([0-9.]*\)".*/\1/p')"
          blob="$(gh api "${api}/contents/${file}?ref=${BRANCH}" --jq .sha)"
          tmp="$(mktemp)"
          gh api "${api}/contents/${file}?ref=${BRANCH}" --jq .content | base64 -d > "${tmp}"
          cp "${tmp}" "${tmp}.orig"
          dev/self-pin.sh "${W}" "${version}" "${tmp}"
          if cmp -s "${tmp}" "${tmp}.orig"; then
            echo "publish.yml on ${BRANCH} already points at ${W}"
            exit 0
          fi
          # A commit made by the API: signed by GitHub, on top of the branch's head.
          gh api -X PUT "${api}/contents/${file}" \
            -f message="chore(release): pin publish.yml to ${W:0:12}" \
            -f content="$(base64 -w0 < "${tmp}")" \
            -f sha="${blob}" \
            -f branch="${BRANCH}" \
            --jq '"pinned in \(.commit.sha)"'

  # The guarantee callers rely on, checked on the tagged commit. A failure here means the release
  # must be replaced (a fix release); the tag itself is immutable.
  check-release:
    name: Check the released publish.yml
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      # The released commit is the one this run was triggered by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the self-pin
        shell: bash
        env:
          RELEASED: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          test "${RELEASED}" = "${GITHUB_SHA}" ||
            { echo "::error::the release was made from ${RELEASED}, not ${GITHUB_SHA}"; exit 1; }
          dev/self-pin.sh --check HEAD
