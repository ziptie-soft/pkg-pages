name: CodeQL

# The `actions` language: workflow and composite-action findings (injection, untrusted checkout,
# excessive permissions). There is no other CodeQL language in this repository.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 22 * * 5'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # CodeQL reads the workflow runs
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none
          queries: +security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:actions'
