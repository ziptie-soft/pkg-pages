# check-site: check a built (and sealed) site the way a client will see it, then upload it as a
# Pages artifact. Needs no secret. Contract: docs/actions.md#check-site.
name: pkg-pages check-site
description: Check a built APT and DNF site against the committed public key, and upload it as a Pages artifact
author: ziptie-soft

inputs:
  site:
    description: The site directory, as build-site and seal-site left it.
    required: true
  public-key:
    description: >-
      Path of the committed public key (the pin), in the caller's checkout. File present: the site
      must be signed by it. File absent: the site must be unsigned.
    required: false
    default: packaging/signing/repo.asc
  name:
    description: Base name of the site's files. Defaults to the repository name.
    required: false
    default: ''
  version:
    description: The release the site publishes; each required Debian architecture's index must list it.
    required: true
  suite:
    description: APT suite and codename.
    required: false
    default: stable
  component:
    description: APT component.
    required: false
    default: main
  deb-architectures:
    description: Space-separated Debian architectures whose Packages index must list `version` (none checked when empty).
    required: false
    default: ''
  upload:
    description: Upload the site with actions/upload-pages-artifact (true) or only check it (false).
    required: false
    default: 'true'
  artifact-name:
    description: Name of the Pages artifact when upload is true.
    required: false
    default: github-pages
  retention-days:
    description: Retention of the Pages artifact (deploying later in the run, or on a re-run, needs more than 1).
    required: false
    default: '1'
  runner-mode:
    description: >-
      docker (pinned Debian image of images.env) or host (gpg, gpgv, rpmkeys, tar and gzip
      already installed).
    required: false
    default: docker

outputs:
  artifact-id:
    description: ID of the uploaded Pages artifact (download by ID, not by name).
    value: ${{ steps.upload.outputs.artifact_id }}

runs:
  using: composite
  steps:
    - name: Check the site
      shell: bash
      env:
        INPUT_SITE: ${{ inputs.site }}
        INPUT_PUBLIC_KEY: ${{ inputs.public-key }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_DEB_ARCHITECTURES: ${{ inputs.deb-architectures }}
        INPUT_UPLOAD: ${{ inputs.upload }}
        INPUT_RUNNER_MODE: ${{ inputs.runner-mode }}
      run: '"$GITHUB_ACTION_PATH/../lib/action.sh" check-site'

    - name: Upload the Pages artifact
      id: upload
      if: ${{ inputs.upload == 'true' }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.site }}
        name: ${{ inputs.artifact-name }}
        retention-days: ${{ inputs.retention-days }}
